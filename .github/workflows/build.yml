name: .NET Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore dependencies
        run: dotnet restore Flavirus.slnx

      - name: Build
        run: dotnet build Flavirus.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Flavirus.Tests/Flavirus.Tests.csproj --no-build --verbosity normal -c Release
